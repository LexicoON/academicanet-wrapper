name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Install Python deps for vector->png generation
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3-pip
          pip3 install --user pillow

      - name: Generate legacy PNG launcher icons from vectors
        run: |
          set -e
          TMPDIR=$(mktemp -d)
          git clone --depth 1 https://github.com/Ashinch/VD-Android-VectorDrawable2PNG.git "$TMPDIR/vd2png"
          mkdir -p "$TMPDIR/out"

          # sizes: ldpi mdpi hdpi xhdpi xxhdpi xxxhdpi
          declare -a spec=("36 ldpi" "48 mdpi" "72 hdpi" "96 xhdpi" "144 xxhdpi" "192 xxxhdpi")

          for pair in "${spec[@]}"; do
            size=$(echo "$pair" | awk '{print $1}')
            density=$(echo "$pair" | awk '{print $2}')
            outdir="app/src/main/res/mipmap-${density}"
            mkdir -p "$outdir"

            # render foreground and background PNGs
            python3 "$TMPDIR/vd2png/VD-Android-VectorDrawable2PNG.py" "app/src/main/res/drawable/ic_launcher_foreground.xml" "$TMPDIR/out/fg_${size}.png" "$size"
            python3 "$TMPDIR/vd2png/VD-Android-VectorDrawable2PNG.py" "app/src/main/res/drawable/ic_launcher_background.xml" "$TMPDIR/out/bg_${size}.png" "$size"

            # composite fg over bg centered using Python Pillow
            cat > /tmp/composite_${size}.py << 'EOF'
from PIL import Image
bg = Image.open("$TMPDIR/out/bg_${size}.png").convert('RGBA')
fg = Image.open("$TMPDIR/out/fg_${size}.png").convert('RGBA')
# center fg on bg
bg_w, bg_h = bg.size
fg_w, fg_h = fg.size
x = (bg_w - fg_w) // 2
y = (bg_h - fg_h) // 2
out = Image.new('RGBA', bg.size)
out.paste(bg, (0,0))
out.paste(fg, (x,y), fg)
out.save("$outdir/ic_launcher.png")
EOF
            python3 /tmp/composite_${size}.py

            # For round variant, just copy the same for now
            cp "$outdir/ic_launcher.png" "$outdir/ic_launcher_round.png"
          done

          # generate 512px Play Store icon
          python3 "$TMPDIR/vd2png/VD-Android-VectorDrawable2PNG.py" "app/src/main/res/drawable/ic_launcher_foreground.xml" "$TMPDIR/out/fg_512.png" 512
          python3 "$TMPDIR/vd2png/VD-Android-VectorDrawable2PNG.py" "app/src/main/res/drawable/ic_launcher_background.xml" "$TMPDIR/out/bg_512.png" 512
          mkdir -p app/playstore
          cat > /tmp/composite_512.py << 'EOF'
from PIL import Image
bg = Image.open("$TMPDIR/out/bg_512.png").convert('RGBA')
fg = Image.open("$TMPDIR/out/fg_512.png").convert('RGBA')
bg_w, bg_h = bg.size
fg_w, fg_h = fg.size
x = (bg_w - fg_w) // 2
y = (bg_h - fg_h) // 2
out = Image.new('RGBA', bg.size)
out.paste(bg, (0,0))
out.paste(fg, (x,y), fg)
out.save("app/playstore/icon_512.png")
EOF
          python3 /tmp/composite_512.py

      - name: Build APK (Debug)
        run: gradle assembleDebug --no-daemon
        env:
          KEYSTORE_PASSWORD: academica123
          KEY_ALIAS: academica
          KEY_PASSWORD: academica123

      - name: Build APK (Release signed)
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: academica123
          KEY_ALIAS: academica
          KEY_PASSWORD: academica123

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: academicanet-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: academicanet-release-signed
          path: app/build/outputs/apk/release/app-release.apk
